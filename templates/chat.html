{% extends "base.html" %}
{% block title %}AI Chat{% endblock %}
{% block content %}

<h4 class="mb-3">🤖 AI Chat Assistant</h4>

<div class="card shadow">
    <div class="card-body" style="height: 400px; overflow-y: auto;" id="chat-box">
        <div class="text-muted small">Ask me anything about your IT problem — e.g. "My printer is not working."</div>
    </div>
    <div class="card-footer">
        <form id="chat-form" class="d-flex">
            <input type="text" id="message-input" class="form-control me-2" placeholder="Type your message..." autocomplete="off" required>
            <button type="submit" class="btn btn-primary">Send</button>
        </form>
    </div>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const chatForm = document.getElementById('chat-form');
const messageInput = document.getElementById('message-input');

function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'mb-2 ' + (sender === 'user' ? 'text-end' : 'text-start');
    div.innerHTML = `<span class="badge ${sender === 'user' ? 'bg-primary' : 'bg-secondary'} p-2">${text}</span>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

chatForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const message = messageInput.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    messageInput.value = '';
    addMessage('Typing...', 'ai');

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });
        const data = await res.json();

        chatBox.removeChild(chatBox.lastChild); // remove "Typing..."
        addMessage(data.reply || data.error, 'ai');
    } catch (err) {
        chatBox.removeChild(chatBox.lastChild);
        addMessage('⚠️ Error connecting to server.', 'ai');
    }
});
</script>

{% endblock %}
